apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: battlefield }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus, namespace: battlefield }
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus, namespace: battlefield }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: battlefield }]
roleRef: { kind: Role, name: prometheus, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: battlefield }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      - job_name: battlefield
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [battlefield] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
  rules.yml: |
    groups:
      - name: battlefield-recording
        rules:
          - record: gw:ttft_p99:1m
            expr: histogram_quantile(0.99, sum by (le, pool) (rate(gw_ttft_seconds_bucket[1m])))
          - record: gw:latency_p99:1m
            expr: histogram_quantile(0.99, sum by (le, pool) (rate(gw_request_seconds_bucket[1m])))
          - record: gw:error_ratio:1m
            expr: sum by (pool) (rate(gw_requests_total{outcome="error"}[1m])) / clamp_min(sum by (pool) (rate(gw_requests_total[1m])), 0.001)
          - record: gw:shed_ratio:1m
            expr: sum(rate(gw_requests_total{outcome="shed"}[1m])) / clamp_min(sum(rate(gw_requests_total[1m])), 0.001)
          - record: user:error_ratio:1m
            expr: sum(rate(attacker_requests_total{outcome=~"error|dropped"}[1m])) / clamp_min(sum(rate(attacker_requests_total[1m])), 0.001)
          - record: worker:ttft_p99:1m
            expr: histogram_quantile(0.99, sum by (le, node, pool) (rate(worker_ttft_seconds_bucket[1m])))
      - name: battlefield-alerts
        rules:
          - alert: HighTTFT
            expr: gw:ttft_p99:1m{pool="stable"} > 1.5
            for: 30s
            labels: { severity: page }
            annotations: { summary: "p99 TTFT {{ $value | humanizeDuration }} on pool {{ $labels.pool }}" }
          - alert: GPUSlow
            expr: max by (node) (worker_ttft_ewma_seconds) > 3 * scalar(quantile(0.5, worker_ttft_ewma_seconds{pool="stable"})) and max by (node) (worker_ttft_ewma_seconds) > 0.8
            for: 20s
            labels: { severity: ticket }
            annotations: { summary: "GPU {{ $labels.node }} TTFT EWMA {{ $value | humanizeDuration }}, >3x fleet median" }
          - alert: KVCachePressure
            expr: worker_kv_utilization > 0.9
            for: 20s
            labels: { severity: ticket }
            annotations: { summary: "KV cache {{ $value | humanizePercentage }} on {{ $labels.node }}" }
          - alert: GPUUnreachable
            expr: gw_backend_healthy == 0
            for: 10s
            labels: { severity: page }
            annotations: { summary: "Gateway cannot reach {{ $labels.backend }}" }
          - alert: HighErrorRate
            expr: gw:error_ratio:1m > 0.02
            for: 20s
            labels: { severity: page }
            annotations: { summary: "Error ratio {{ $value | humanizePercentage }} on pool {{ $labels.pool }}" }
          - alert: HeavyLoadShedding
            expr: gw:shed_ratio:1m > 0.2
            for: 30s
            labels: { severity: ticket }
            annotations: { summary: "Gateway shedding {{ $value | humanizePercentage }} of traffic" }
          - alert: TenantStarvation
            expr: sum by (tenant) (rate(gw_shed_total[1m])) / clamp_min(sum by (tenant) (rate(gw_requests_total[1m])), 0.001) > 0.5 and on (tenant) sum by (tenant) (rate(gw_requests_total[1m])) > 1
            for: 30s
            labels: { severity: ticket }
            annotations: { summary: "Tenant {{ $labels.tenant }} has {{ $value | humanizePercentage }} of requests shed" }
          - alert: CanaryRegression
            expr: gw:ttft_p99:1m{pool="canary"} > ignoring(pool) (1.3 * gw:ttft_p99:1m{pool="stable"}) and on() gw_canary_weight > 0
            for: 30s
            labels: { severity: page }
            annotations: { summary: "Canary p99 TTFT is {{ $value | humanizeDuration }}, >1.3x stable" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: battlefield }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=24h, --web.enable-lifecycle]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: battlefield }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, nodePort: 30090 }]
